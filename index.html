<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14213d;
    --ink-soft: #5b6478;
    --paper: #f3f5f8;
    --card: #ffffff;
    --line: #dde2ea;
    --hiring: #0f766e;
    --hiring-bg: #d9f1ee;
    --sales: #b45309;
    --sales-bg: #fdebd2;
    --accent: #1d4ed8;
    --danger: #b91c1c;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.45;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* Login */
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 32px; }
  .login h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.02em; }
  .login p { margin: 0 0 22px; color: var(--ink-soft); }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  input[type=text], input[type=email], input[type=password], input[type=search], select, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
  }
  textarea { min-height: 110px; resize: vertical; }
  .btn { border: 1px solid var(--ink); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 8px; font-weight: 600; }
  .btn:hover { background: #0c1730; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.ghost:hover { background: var(--paper); }
  .btn.block { width: 100%; margin-top: 20px; }
  .error { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 18px; }

  /* Header */
  header.top { background: var(--ink); color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 16px; }
  header.top h1 { margin: 0; font-size: 19px; letter-spacing: -0.01em; }
  header.top .spacer { flex: 1; }
  header.top .who { font-size: 13px; opacity: .75; }
  header.top .btn { background: transparent; border-color: rgba(255,255,255,.35); padding: 6px 12px; font-size: 13px; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; opacity: .8; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; display: inline-block; }
  .live.off i { background: #f59e0b; }

  main { max-width: 1240px; margin: 0 auto; padding: 22px 24px 60px; }

  /* Summary */
  .summary { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .stat .n { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .stat .l { color: var(--ink-soft); font-size: 13px; margin-top: 2px; }
  .stat.hiring { border-top: 3px solid var(--hiring); }
  .stat.sales { border-top: 3px solid var(--sales); }
  .stat .bar { height: 5px; background: var(--paper); border-radius: 3px; margin-top: 10px; overflow: hidden; }
  .stat .bar span { display: block; height: 100%; background: var(--ink-soft); }
  .stat.hiring .bar span { background: var(--hiring); }
  .stat.sales .bar span { background: var(--sales); }

  /* Toolbar */
  .tabs { display: inline-flex; background: #e6eaf0; border-radius: 9px; padding: 3px; margin-bottom: 14px; }
  .tabs button { border: 0; background: transparent; padding: 7px 16px; border-radius: 7px; font-weight: 600; color: var(--ink-soft); }
  .tabs button[aria-pressed=true] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(20,33,61,.12); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .toolbar input[type=search] { flex: 1 1 220px; }
  .toolbar select { width: auto; flex: 0 1 170px; }
  .toolbar .btn { margin-left: auto; }

  /* Table */
  .table-wrap { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 820px; }
  th { text-align: left; font-size: 13px; color: var(--ink-soft); font-weight: 600; padding: 11px 14px; border-bottom: 1px solid var(--line); background: #fafbfc; white-space: nowrap; }
  td { padding: 12px 14px; border-bottom: 1px solid #eef1f5; vertical-align: middle; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #f7f9fc; }
  tbody tr:last-child td { border-bottom: 0; }
  .name { font-weight: 600; }
  .sub { color: var(--ink-soft); font-size: 13px; }
  .chip { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .chip.hiring { background: var(--hiring-bg); color: var(--hiring); }
  .chip.sales { background: var(--sales-bg); color: var(--sales); }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; white-space: nowrap; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; }
  .status.s-new i { background: var(--accent); }
  .status.s-good i { background: #16a34a; }
  .status.s-bad i { background: var(--danger); }
  .status.s-mid i { background: #f59e0b; }
  .empty { padding: 48px 20px; text-align: center; color: var(--ink-soft); }
  .count { color: var(--ink-soft); font-size: 13px; margin: 10px 2px 0; }

  /* Drawer */
  .scrim { position: fixed; inset: 0; background: rgba(20,33,61,.35); z-index: 20; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--card); z-index: 21; overflow-y: auto; padding: 22px; box-shadow: -8px 0 30px rgba(20,33,61,.18); }
  .drawer h2 { margin: 0 0 2px; font-size: 21px; letter-spacing: -0.01em; }
  .drawer .close { position: absolute; top: 14px; right: 14px; border: 0; background: transparent; font-size: 24px; line-height: 1; color: var(--ink-soft); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
  .actions a { text-decoration: none; }
  .actions .btn { display: inline-block; padding: 7px 13px; font-size: 14px; }
  dl.details { display: grid; grid-template-columns: 120px 1fr; gap: 8px 12px; margin: 18px 0 0; font-size: 14px; }
  dl.details dt { color: var(--ink-soft); }
  dl.details dd { margin: 0; word-break: break-word; }
  .section-title { font-weight: 700; margin: 22px 0 0; font-size: 14px; }
  .saved { color: #15803d; font-size: 13px; margin-left: 10px; }

  /* Toast */
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 9px; z-index: 40; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }

  @media (max-width: 900px) {
    .summary { grid-template-columns: repeat(2, 1fr); }
    main { padding: 16px 14px 50px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .toast { animation: pop .2s ease-out; }
    @keyframes pop { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login-wrap hidden">
  <div class="login">
    <h1>Lead Desk</h1>
    <p>Sign in to see leads from your Meta ads.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password">
    <button id="loginBtn" class="btn block">Sign in</button>
    <div id="loginError" class="error" role="alert"></div>
  </div>
</div>

<!-- APP -->
<div id="appView" class="hidden">
  <header class="top">
    <h1>Lead Desk</h1>
    <span id="liveBadge" class="live off"><i></i><span id="liveText">Connecting</span></span>
    <span class="spacer"></span>
    <span id="who" class="who"></span>
    <button id="logoutBtn" class="btn">Sign out</button>
  </header>

  <main>
    <section class="summary" id="summary" aria-label="Summary"></section>

    <div class="tabs" role="group" aria-label="Lead type">
      <button data-type="all" aria-pressed="true">All leads</button>
      <button data-type="hiring" aria-pressed="false">Hiring</button>
      <button data-type="sales" aria-pressed="false">Sales</button>
    </div>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Search name, email, phone or ad">
      <select id="fCategory" aria-label="Category">
        <option value="">All categories</option>
        <option value="graphic-designer">Graphic designer</option>
        <option value="videographer">Videographer</option>
        <option value="smm-lead">SMM lead</option>
      </select>
      <select id="fStatus" aria-label="Status"><option value="">All statuses</option></select>
      <select id="fDate" aria-label="Date range">
        <option value="">All time</option>
        <option value="today">Today</option>
        <option value="7">Last 7 days</option>
        <option value="30">Last 30 days</option>
      </select>
      <button id="exportBtn" class="btn ghost">Export CSV</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Lead</th><th>Phone</th><th>Category</th><th>Ad</th><th>Status</th><th>Received</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty hidden">No leads match these filters.</div>
    </div>
    <div id="countLine" class="count"></div>
  </main>
</div>

<!-- DRAWER -->
<div id="scrim" class="scrim hidden"></div>
<aside id="drawer" class="drawer hidden" aria-label="Lead details"></aside>
<div id="toast" class="toast hidden" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ---------- Config ---------- */
const SUPABASE_URL = "https://vlpjwyblxvpikshvgiqx.supabase.co";
const SUPABASE_KEY = "sb_publishable_slyyVPuIqj49sAW8QipQGg_9q11n_WG"; // public key, safe in the browser

const CATEGORIES = {
  "graphic-designer": { label: "Graphic designer", type: "hiring" },
  "videographer":     { label: "Videographer",     type: "hiring" },
  "smm-lead":         { label: "SMM lead",         type: "sales"  }
};
const STAGES = {
  hiring: ["New", "Shortlisted", "Interviewed", "Hired", "Rejected"],
  sales:  ["New", "Contacted", "Qualified", "Won", "Lost"]
};
const ALL_STATUSES = ["New", "Shortlisted", "Interviewed", "Hired", "Rejected", "Contacted", "Qualified", "Won", "Lost"];
const STATUS_CLASS = {
  "New": "s-new", "Shortlisted": "s-mid", "Interviewed": "s-mid", "Hired": "s-good", "Rejected": "s-bad",
  "Contacted": "s-mid", "Qualified": "s-mid", "Won": "s-good", "Lost": "s-bad"
};

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (id) => document.getElementById(id);

let leads = [];
let typeTab = "all";
let openId = null;
let channel = null;

/* ---------- Helpers ---------- */
function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
}
function ago(iso) {
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " hr ago";
  if (s < 86400 * 7) return Math.floor(s / 86400) + " d ago";
  return fmtDate(iso);
}
function digits(phone) {
  let d = String(phone || "").replace(/\D/g, "");
  if (d.length === 10) d = "91" + d; // assume India for bare 10-digit numbers
  return d;
}
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add("hidden"), 3500);
}
function statusHtml(s) {
  return `<span class="status ${STATUS_CLASS[s] || ""}"><i></i>${esc(s)}</span>`;
}
function catChip(cat) {
  const c = CATEGORIES[cat] || { label: cat, type: "sales" };
  return `<span class="chip ${c.type}">${esc(c.label)}</span>`;
}

/* ---------- Auth ---------- */
async function boot() {
  const { data } = await sb.auth.getSession();
  if (data.session) showApp(data.session.user); else showLogin();
  sb.auth.onAuthStateChange((_e, session) => {
    if (!session) showLogin();
  });
}
function showLogin() {
  $("appView").classList.add("hidden");
  $("loginView").classList.remove("hidden");
  if (channel) { sb.removeChannel(channel); channel = null; }
}
async function showApp(user) {
  $("loginView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  $("who").textContent = user.email;
  await loadLeads();
  subscribe();
}
$("loginBtn").addEventListener("click", doLogin);
$("password").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
async function doLogin() {
  $("loginError").textContent = "";
  const { data, error } = await sb.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("password").value
  });
  if (error) { $("loginError").textContent = error.message; return; }
  showApp(data.user);
}
$("logoutBtn").addEventListener("click", async () => { await sb.auth.signOut(); closeDrawer(); });

/* ---------- Data ---------- */
async function loadLeads() {
  const { data, error } = await sb.from("leads").select("*").order("created_at", { ascending: false }).limit(2000);
  if (error) { toast("Could not load leads: " + error.message); return; }
  leads = data;
  render();
}
function subscribe() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel("leads-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "leads" }, (p) => {
      if (p.eventType === "INSERT") {
        leads.unshift(p.new);
        const c = CATEGORIES[p.new.category];
        toast("New lead: " + (p.new.name || "Unknown") + (c ? " (" + c.label + ")" : ""));
      } else if (p.eventType === "UPDATE") {
        const i = leads.findIndex((l) => l.id === p.new.id);
        if (i > -1) leads[i] = p.new;
      } else if (p.eventType === "DELETE") {
        leads = leads.filter((l) => l.id !== p.old.id);
      }
      render();
      if (openId) refreshDrawerIfOpen();
    })
    .subscribe((status) => {
      const ok = status === "SUBSCRIBED";
      $("liveBadge").classList.toggle("off", !ok);
      $("liveText").textContent = ok ? "Live" : "Reconnecting";
    });
}

/* ---------- Filtering ---------- */
function inDateRange(l, range) {
  if (!range) return true;
  const t = new Date(l.created_at);
  if (range === "today") {
    const s = new Date(); s.setHours(0, 0, 0, 0);
    return t >= s;
  }
  return Date.now() - t.getTime() <= Number(range) * 86400000;
}
function filtered() {
  const q = $("search").value.trim().toLowerCase();
  const cat = $("fCategory").value;
  const st = $("fStatus").value;
  const dr = $("fDate").value;
  return leads.filter((l) => {
    if (typeTab !== "all" && l.lead_type !== typeTab) return false;
    if (cat && l.category !== cat) return false;
    if (st && l.status !== st) return false;
    if (!inDateRange(l, dr)) return false;
    if (q) {
      const hay = [l.name, l.email, l.phone, l.ad_name, l.campaign_name].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ---------- Render ---------- */
function renderSummary() {
  const dr = $("fDate").value;
  const base = leads.filter((l) => inDateRange(l, dr));
  const startToday = new Date(); startToday.setHours(0, 0, 0, 0);
  const today = leads.filter((l) => new Date(l.created_at) >= startToday).length;
  const fresh = base.filter((l) => l.status === "New").length;
  const max = Math.max(1, base.length);
  let html = `
    <div class="stat"><div class="n">${today}</div><div class="l">Received today</div></div>
    <div class="stat"><div class="n">${fresh}</div><div class="l">Still marked New</div></div>`;
  for (const [key, c] of Object.entries(CATEGORIES)) {
    const n = base.filter((l) => l.category === key).length;
    html += `<div class="stat ${c.type}"><div class="n">${n}</div><div class="l">${esc(c.label)}${c.type === "hiring" ? " applicants" : " leads"}</div>
      <div class="bar"><span style="width:${Math.round((n / max) * 100)}%"></span></div></div>`;
  }
  $("summary").innerHTML = html;
}
function syncStatusFilter() {
  const sel = $("fStatus");
  const cur = sel.value;
  const list = typeTab === "all" ? ALL_STATUSES : STAGES[typeTab];
  sel.innerHTML = '<option value="">All statuses</option>' + list.map((s) => `<option>${esc(s)}</option>`).join("");
  sel.value = list.includes(cur) ? cur : "";
}
function render() {
  renderSummary();
  const rows = filtered();
  $("rows").innerHTML = rows.map((l) => `
    <tr data-id="${esc(l.id)}">
      <td><div class="name">${esc(l.name || "No name")}</div><div class="sub">${esc(l.email || "")}</div></td>
      <td>${esc(l.phone || "")}</td>
      <td>${catChip(l.category)}</td>
      <td><div>${esc(l.ad_name || "-")}</div><div class="sub">${esc(l.campaign_name || "")}</div></td>
      <td>${statusHtml(l.status)}</td>
      <td title="${esc(fmtDate(l.created_at))}">${esc(ago(l.created_at))}</td>
    </tr>`).join("");
  $("empty").classList.toggle("hidden", rows.length > 0);
  $("countLine").textContent = rows.length + " of " + leads.length + " leads shown";
}

/* ---------- Drawer ---------- */
function openDrawer(id) {
  openId = id;
  const l = leads.find((x) => x.id === id);
  if (!l) return;
  const cat = CATEGORIES[l.category] || { label: l.category, type: l.lead_type };
  const stages = STAGES[l.lead_type] || ALL_STATUSES;
  const wa = digits(l.phone);
  const extra = Object.entries(l.extra || {}).map(([k, v]) =>
    `<dt>${esc(k.replace(/_/g, " "))}</dt><dd>${esc(Array.isArray(v) ? v.join(", ") : v)}</dd>`).join("");

  $("drawer").innerHTML = `
    <button class="close" id="closeBtn" aria-label="Close">&times;</button>
    <h2>${esc(l.name || "No name")}</h2>
    <div>${catChip(l.category)} <span class="sub">${esc(cat.type === "hiring" ? "Hiring" : "Sales")}</span></div>
    <div class="actions">
      ${l.phone ? `<a class="btn" href="tel:${esc(l.phone)}">Call</a>` : ""}
      ${wa ? `<a class="btn ghost" href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener">WhatsApp</a>` : ""}
      ${l.email ? `<a class="btn ghost" href="mailto:${esc(l.email)}">Email</a>` : ""}
    </div>

    <label for="dStatus">Status</label>
    <select id="dStatus">${stages.map((s) => `<option ${s === l.status ? "selected" : ""}>${esc(s)}</option>`).join("")}</select>

    <label for="dNotes">Notes</label>
    <textarea id="dNotes" placeholder="Call outcome, next step, interview time">${esc(l.notes || "")}</textarea>
    <div style="margin-top:10px"><button id="saveNotes" class="btn">Save notes</button><span id="savedMsg" class="saved hidden">Saved</span></div>

    <div class="section-title">Details</div>
    <dl class="details">
      <dt>Phone</dt><dd>${esc(l.phone || "-")}</dd>
      <dt>Email</dt><dd>${esc(l.email || "-")}</dd>
      <dt>Ad</dt><dd>${esc(l.ad_name || "-")}</dd>
      <dt>Campaign</dt><dd>${esc(l.campaign_name || "-")}</dd>
      <dt>Form</dt><dd>${esc(l.form_name || "-")}</dd>
      <dt>Source</dt><dd>${esc(l.source || "-")}</dd>
      <dt>Received</dt><dd>${esc(fmtDate(l.created_at))}</dd>
      ${extra}
    </dl>`;
  $("drawer").classList.remove("hidden");
  $("scrim").classList.remove("hidden");
  $("closeBtn").addEventListener("click", closeDrawer);
  $("dStatus").addEventListener("change", (e) => updateLead(id, { status: e.target.value }, "Status updated"));
  $("saveNotes").addEventListener("click", async () => {
    const ok = await updateLead(id, { notes: $("dNotes").value }, null);
    if (ok) { const m = $("savedMsg"); m.classList.remove("hidden"); setTimeout(() => m.classList.add("hidden"), 2000); }
  });
}
function refreshDrawerIfOpen() {
  const l = leads.find((x) => x.id === openId);
  const sel = $("dStatus");
  if (l && sel && sel.value !== l.status) sel.value = l.status;
}
function closeDrawer() {
  openId = null;
  $("drawer").classList.add("hidden");
  $("scrim").classList.add("hidden");
}
async function updateLead(id, patch, msg) {
  const { data, error } = await sb.from("leads").update(patch).eq("id", id).select().single();
  if (error || !data) { toast("Could not save: " + (error ? error.message : "no permission")); return false; }
  const i = leads.findIndex((l) => l.id === id);
  if (i > -1) leads[i] = data;
  render();
  if (msg) toast(msg);
  return true;
}

/* ---------- Export ---------- */
function exportCsv() {
  const rows = filtered();
  const cols = ["name", "email", "phone", "category", "lead_type", "status", "ad_name", "campaign_name", "form_name", "source", "notes", "created_at"];
  const cell = (v) => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const csv = [cols.join(",")].concat(rows.map((r) => cols.map((c) => cell(r[c])).join(","))).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "leads-" + new Date().toISOString().slice(0, 10) + ".csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ---------- Events ---------- */
document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
  typeTab = b.dataset.type;
  document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  const catSel = $("fCategory");
  if (catSel.value && typeTab !== "all" && CATEGORIES[catSel.value].type !== typeTab) catSel.value = "";
  syncStatusFilter();
  render();
}));
["search", "fCategory", "fStatus", "fDate"].forEach((id) => $(id).addEventListener("input", render));
$("rows").addEventListener("click", (e) => {
  const tr = e.target.closest("tr");
  if (tr) openDrawer(tr.dataset.id);
});
$("scrim").addEventListener("click", closeDrawer);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
$("exportBtn").addEventListener("click", exportCsv);

syncStatusFilter();
boot();
</script>
</body>
</html>
